<body>
<div id="lock" class="lock">
  <form autocomplete="off">
    <h1>KCC IR Meet</h1>
    <p>English IR meeting companion · passcode</p>
    <input type="password" inputmode="text" placeholder="••••" aria-label="passcode">
    <button type="submit">Open</button>
    <div class="err"></div>
  </form>
</div>

<header class="hdr">
  <div class="hdr-in">
    <div class="brand display"><b>KCC</b><span>IR Meet</span></div>
    <span class="qbadge" id="qbadge"></span>
    <nav class="topnav" id="topnav"></nav>
    <div class="hdr-ctrl">
      <button class="hbtn" id="krBtn" title="Korean gist on/off (K)">한글</button>
      <button class="hbtn sm" id="aMinus" title="Smaller text">A−</button>
      <button class="hbtn sm" id="aPlus" title="Larger text">A+</button>
      <button class="hbtn sm" id="themeBtn" title="Light / dark">🌓</button>
    </div>
  </div>
</header>

<main class="main">
  <div id="status" class="status hidden"></div>
  <div id="main"></div>
</main>

<nav class="tabbar" id="tabbar"></nav>
